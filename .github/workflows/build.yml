# Builds the site every hour and publishes it to GitHub Pages. Finished games are picked up
# from nblR or, if it's behind, straight from the NBL feed, so results usually appear within an
# hour or two of the final buzzer. (Minute 17 avoids the top-of-the-hour queue on GitHub.)
name: Build and publish site
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write  # alert.py opens an issue when a data source breaks
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the last data check
        uses: actions/cache/restore@v4
        with:
          path: data/health-last.json
          key: source-health-${{ github.run_id }}
          restore-keys: source-health-
      # The data archive is a private repo, so the raw data and the model's daily numbers stay out
      # of public view. It needs an ARCHIVE_TOKEN secret; without one, or if anything here fails,
      # the site still builds and publishes as normal.
      - name: Check for the data archive
        id: has_archive
        env:
          TOKEN: ${{ secrets.ARCHIVE_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get the data archive
        id: archive
        if: steps.has_archive.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: kimchiwithrice/nbl-data
          token: ${{ secrets.ARCHIVE_TOKEN }}
          path: archive
      - id: build
        run: python run.py ${{ steps.archive.outcome == 'success' && '--archive archive' || '' }}
      - name: Alert if a data source is broken
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python alert.py ${{ steps.build.outcome == 'failure' && '--build-failed' || '' }}
      - name: Save the data check for the next build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/health-last.json
          key: source-health-${{ github.run_id }}
      - name: Keep the prediction ledger and weekly history
        continue-on-error: true  # publish the site even if this commit fails
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/ledger.json data/weeks.json data/pages.json
          if ! git diff --cached --quiet; then git commit -m "Update prediction ledger" && git push; fi
      - name: Save the data archive
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        working-directory: archive
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Data as of $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 10
          done
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
