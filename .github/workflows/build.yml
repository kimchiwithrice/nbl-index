# Builds the site twice a day and publishes it to GitHub Pages.
# The data source updates at about 22:45 UTC, so the 23:40 run picks up the previous night's games.
name: Build and publish site
on:
  schedule:
    - cron: "40 23 * * *"
    - cron: "40 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Keep the prediction ledger
        continue-on-error: true  # publish the site even if this commit fails
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/ledger.json
          if ! git diff --cached --quiet; then git commit -m "Update prediction ledger" && git push; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
